---
layout: default
bodyClass: "page-contact"
---

<div class="intro" {% if page.intro_background_image %} style="background-image: url('{{ page.intro_background_image | relative_url }}'); background-position: center; background-size: cover;"{% endif %}>
  <div class="container">
    {% if page.span_title %}
    <div class="row justify-content-center">
      <div class="col-12 col-md-10 col-lg-12 text-center">
        <h1 class="intro-span-title">{{ page.span_title }}</h1>
      </div>
    </div>
    {% endif %}
    <div class="row justify-content-start">
      <div class="col-12 col-md-7 order-2 order-md-1">
        {{ content }}
      </div>
      {% if page.intro_image %}
      <div class="col-12 col-md-5 order-1 order-md-2 position-relative" style="justify-content: flex-end;">
        <img alt={{ page.title }} class="intro-image{% if page.intro_image_absolute %} intro-image-absolute{% endif %}{% if page.intro_image_hide_on_mobile %} intro-image-hide-mobile{% endif %}" src="{{ page.intro_image | relative_url }}" />
      </div>
      {% endif %}
    </div>
  </div>
</div>
<div class="container pb-6 pt-6 pt-md-10 pb-md-10">
    <div class="row justify-content-start">
        <div class="col-12">
            <div class="service service-single">
                {% include call.html show_button=false %}
            </div>
        </div>
    </div>
</div>
